# Default kiosk settings; /data/kiosk/kiosk.conf (written by the setup page) overrides them.
KIOSK_URL=""   # set by the setup page (stored in /data/kiosk/kiosk.conf)
# extra options for cog, e.g. scale: --scale=1.0
# renderer=gles is required: the default "modeset" renderer puts WebKit's
# (tiled) GPU buffers on the VOP without a modifier -> only noise on screen.
# --webprocess-failure=restart: after a renderer crash ("Crash!" page) the
#   page is reloaded automatically instead of staying on the error page.
# --web-mem-limit: WebKit reclaims caches early at 400 MiB (950 MB RAM in total);
#   kill threshold stays 0 (= never kill on memory).
COG_OPTS="--platform-params=renderer=gles --webprocess-failure=restart --web-mem-limit=400 --web-conservative-threshold=0.45 --web-strict-threshold=0.75"
